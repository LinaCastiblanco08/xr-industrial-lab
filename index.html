<html>
<!DOCTYPE html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Piso y Cielo -->
    <a-plane rotation="-90 0 0" width="15" height="15" color="#A9A9A9"></a-plane>
    <a-sky color="#ECECEC"></a-sky>

    <!-- SISTEMA: BANDA TRANSPORTADORA -->
    <!-- Estructura principal (Cinta) -->
    <a-box position="0 1 -4" width="1.2" height="0.1" depth="4" color="#2B2B2B"></a-box>

    <!-- Rodillos en los extremos -->
    <a-cylinder position="0 1 -2" radius="0.06" height="1.2" rotation="0 0 90" color="#FFC65D"></a-cylinder>
    <a-cylinder position="0 1 -6" radius="0.06" height="1.2" rotation="0 0 90" color="#FFC65D"></a-cylinder>

    <!-- Soportes / Patas -->
    <a-cylinder position="-0.5 0.5 -2.5" radius="0.05" height="1" color="#777777"></a-cylinder>
    <a-cylinder position="0.5 0.5 -2.5" radius="0.05" height="1" color="#777777"></a-cylinder>
    <a-cylinder position="-0.5 0.5 -5.5" radius="0.05" height="1" color="#777777"></a-cylinder>
    <a-cylinder position="0.5 0.5 -5.5" radius="0.05" height="1" color="#777777"></a-cylinder>

    <!-- Objeto siendo transportado (Caja industrial) -->
    <a-box position="0 1.25 -3" width="0.6" height="0.4" depth="0.6" color="#4CC3D9"></a-box>
    
  </a-scene>
</body>
</html>
