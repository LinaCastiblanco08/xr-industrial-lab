<html>
<!DOCTYPE html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Aquí cargamos el modelo 3D apuntando a la carpeta models -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/helicopter.glb"></a-asset-item>
    </a-assets>

    <!-- Piso y Cielo -->
    <a-plane rotation="-90 0 0" width="15" height="15" color="#A9A9A9"></a-plane>
    <a-sky color="#ECECEC"></a-sky>

    <!-- Aquí mostramos el modelo en la escena con el tamaño reducido -->
    <a-entity gltf-model="#modeloIndustrial" position="0 1 -5" scale="0.001 0.001 0.001"></a-entity>
    
  </a-scene>
</body>
</html>
